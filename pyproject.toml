[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inpysta"
version = "1.0.2"
authors = [
    { name = "Elia Jebreen", email = "opfr.eli@gmail.com" }
]
description = "A lightweight Python library that simulates an Instagram database engine for practice and mock backend design."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com"
Issues = "https://github.com/issues"
